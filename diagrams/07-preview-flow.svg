<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="1100" height="680" fill="url(#bg)" rx="12"/>

  <text x="550" y="32" text-anchor="middle" fill="#c7d2fe" font-size="16" font-weight="700">Luong du lieu — File Preview Flow</text>
  <text x="550" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">User click file .pptx → preview hien thi ngay trong app (khong can mo Office)</text>

  <!-- Diagram wrapper -->
  <rect x="40" y="70" width="1020" height="590" rx="10" fill="#1a1a2e" stroke="#2d2d4a" stroke-width="1"/>

  <!-- Actors -->
  <rect x="65" y="95" width="130" height="44" rx="22" fill="#4f46e5" filter="url(#shadow)"/>
  <text x="130" y="117" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="700">User</text>
  <text x="130" y="131" text-anchor="middle" fill="#a5b4fc" font-size="9">Nhan vao file</text>

  <rect x="240" y="95" width="140" height="44" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="310" y="117" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="600">React UI</text>
  <text x="310" y="131" text-anchor="middle" fill="#94a3b8" font-size="9">apps/app</text>

  <rect x="425" y="95" width="140" height="44" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="495" y="117" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="600">Electron IPC</text>
  <text x="495" y="131" text-anchor="middle" fill="#94a3b8" font-size="9">Electron main</text>

  <rect x="610" y="95" width="140" height="44" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="680" y="117" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="600">OfficeCLI</text>
  <text x="680" y="131" text-anchor="middle" fill="#94a3b8" font-size="9">binary sidecar</text>

  <rect x="795" y="95" width="140" height="44" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="865" y="117" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="600">File System</text>
  <text x="865" y="131" text-anchor="middle" fill="#94a3b8" font-size="9">disk</text>

  <rect x="965" y="95" width="80" height="44" rx="8" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1005" y="117" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">Mammoth</text>
  <text x="1005" y="131" text-anchor="middle" fill="#94a3b8" font-size="9">(fallback)</text>

  <!-- Step 1 -->
  <rect x="65" y="175" width="80" height="24" rx="12" fill="#4338ca"/>
  <text x="105" y="191" text-anchor="middle" fill="#e0e7ff" font-size="10" font-weight="600">B1</text>

  <line x1="195" y1="139" x2="195" y2="190" stroke="#4f46e5" stroke-width="1.5"/>
  <path d="M 195 190 L 235 190" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="235,190 225,186 225,194" fill="#4f46e5"/>

  <text x="220" y="180" fill="#94a3b8" font-size="10">Click file "deck.pptx"</text>

  <!-- Step 2 -->
  <rect x="240" y="200" width="130" height="50" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="305" y="222" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">B2: classify</text>
  <text x="305" y="240" text-anchor="middle" fill="#94a3b8" font-size="9">.pptx → preview: "slides"</text>

  <!-- Step 3 -->
  <line x1="310" y1="250" x2="310" y2="280" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="310,280 300,270 320,270" fill="#4f46e5"/>

  <rect x="240" y="285" width="130" height="50" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="305" y="307" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">B3: invokeIPC</text>
  <text x="305" y="325" text-anchor="middle" fill="#94a3b8" font-size="9">officecli, view, html</text>

  <!-- Step 4 -->
  <line x1="380" y1="310" x2="420" y2="310" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="420,310 410,306 410,314" fill="#4f46e5"/>

  <rect x="425" y="285" width="130" height="50" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="490" y="307" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">B4: spawn CLI</text>
  <text x="490" y="325" text-anchor="middle" fill="#94a3b8" font-size="9">officecli view deck.pptx</text>

  <!-- Step 5a: PPTX path -->
  <line x1="490" y1="335" x2="490" y2="370" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="490" y1="370" x2="680" y2="370" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="680,370 670,366 670,374" fill="#4f46e5"/>

  <rect x="530" y="355" width="110" height="20" rx="10" fill="#1e3a5f"/>
  <text x="585" y="369" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">File .pptx path</text>

  <rect x="610" y="380" width="130" height="50" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="675" y="402" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">B5: Read file</text>
  <text x="675" y="420" text-anchor="middle" fill="#94a3b8" font-size="9">pptx binary → parse→HTML</text>

  <!-- Step 5b: DOCX via Mammoth -->
  <line x1="490" y1="335" x2="490" y2="450" stroke="#10b981" stroke-width="1" stroke-dasharray="4"/>
  <line x1="490" y1="450" x2="1005" y2="450" stroke="#10b981" stroke-width="1" stroke-dasharray="4"/>
  <polygon points="1005,450 995,446 995,454" fill="#10b981"/>

  <rect x="530" y="435" width="120" height="20" rx="10" fill="#064e3b"/>
  <text x="590" y="449" text-anchor="middle" fill="#6ee7b7" font-size="9" font-weight="600">File .docx (alt)</text>

  <rect x="930" y="380" width="130" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="995" y="402" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">B5b: Mammoth</text>
  <text x="995" y="420" text-anchor="middle" fill="#a7f3d0" font-size="9">DOCX → HTML</text>

  <!-- Return path -->
  <line x1="675" y1="430" x2="675" y2="500" stroke="#4f46e5" stroke-width="1.5"/>
  <line x1="675" y1="500" x2="495" y2="500" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="495,500 505,496 505,504" fill="#4f46e5"/>

  <line x1="1005" y1="430" x2="1005" y2="500" stroke="#10b981" stroke-width="1" stroke-dasharray="4"/>
  <line x1="1005" y1="500" x2="495" y2="500" stroke="#10b981" stroke-width="1" stroke-dasharray="4"/>

  <rect x="530" y="488" width="120" height="20" rx="10" fill="#1e3a5f"/>
  <text x="590" y="502" text-anchor="middle" fill="#93c5fd" font-size="9" font-weight="600">JSON {html: slides}</text>

  <!-- Step 6: IPC returns -->
  <line x1="425" y1="500" x2="425" y2="530" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="425,530 415,520 435,520" fill="#4f46e5"/>

  <rect x="360" y="535" width="130" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="425" y="557" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">B6: IPC→UI</text>
  <text x="425" y="570" text-anchor="middle" fill="#94a3b8" font-size="9">{html: slidesHtml}</text>

  <!-- Step 7: Render -->
  <line x1="310" y1="310" x2="310" y2="560" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4"/>
  <line x1="310" y1="560" x2="360" y2="560" stroke="#4f46e5" stroke-width="1.5"/>
  <polygon points="360,560 350,556 350,564" fill="#4f46e5"/>

  <rect x="240" y="575" width="130" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="305" y="597" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">B7: Render</text>
  <text x="305" y="610" text-anchor="middle" fill="#94a3b8" font-size="9">iframe srcDoc={html}</text>

  <!-- Result -->
  <line x1="195" y1="595" x2="240" y2="595" stroke="#10b981" stroke-width="2"/>
  <polygon points="240,595 230,591 230,599" fill="#10b981"/>

  <rect x="65" y="575" width="130" height="44" rx="22" fill="#065f46" stroke="#10b981" stroke-width="2"/>
  <text x="130" y="597" text-anchor="middle" fill="#d1fae5" font-size="12" font-weight="700">Ket qua</text>
  <text x="130" y="611" text-anchor="middle" fill="#a7f3d0" font-size="9">Xem slide trong app!</text>

  <!-- Vertical container labels -->
  <rect x="65" y="148" width="10" height="230" rx="3" fill="#4338ca" opacity="0.3"/>
  <rect x="240" y="148" width="10" height="470" rx="3" fill="#4338ca" opacity="0.3"/>
  <rect x="425" y="148" width="10" height="230" rx="3" fill="#4338ca" opacity="0.3"/>
  <rect x="610" y="148" width="10" height="230" rx="3" fill="#4338ca" opacity="0.3"/>
</svg>
