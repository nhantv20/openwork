  <text x="140" y="334" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">GD 6</text>
  <text x="140" y="349" text-anchor="middle" fill="#94a3b8" font-size="10">Version History</text>

  <rect x="780" y="324" width="120" height="24" rx="6" fill="#6ee7b7" opacity="0.7"/>
  <text x="840" y="341" text-anchor="middle" fill="#064e3b" font-size="11">Track &amp; Rollback</text>

  <!-- Section: P1 -->
  <rect x="60" y="373" width="980" height="30" rx="4" fill="#4338ca"/>
  <text x="80" y="392" fill="#e0e7ff" font-size="12" font-weight="700">P1 — Nang cao</text>

  <!-- GĐ 3: Scheduled Tasks -->
  <rect x="60" y="412" width="160" height="44" rx="4" fill="#1e1b4b" stroke="#2d2d4a" stroke-width="1"/>
  <text x="140" y="432" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">GD 3</text>
  <text x="140" y="447" text-anchor="middle" fill="#94a3b8" font-size="10">Scheduled Tasks</text>

  <rect x="320" y="422" width="250" height="24" rx="6" fill="#6366f1" opacity="0.85"/>
  <text x="445" y="439" text-anchor="middle" fill="#e0e7ff" font-size="11">Cron jobs, research dinh ky</text>

