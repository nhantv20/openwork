<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="1100" height="700" fill="url(#bg)" rx="12"/>

  <text x="550" y="32" text-anchor="middle" fill="#c7d2fe" font-size="16" font-weight="700">Roadmap — Lo trinh phat trien v1.0</text>
  <text x="550" y="50" text-anchor="middle" fill="#94a3b8" font-size="11">P0 (Core, xanh la) → P1 (Nang cao, xanh duong) → P2 (Optional, xam) → Release v1.0</text>

  <!-- Timeline header -->
  <rect x="60" y="70" width="980" height="36" rx="6" fill="#1e1b4b" stroke="#2d2d4a" stroke-width="1"/>
  <text x="100" y="93" fill="#94a3b8" font-size="12" font-weight="600">Giai doan</text>
  <text x="240" y="93" fill="#94a3b8" font-size="12" font-weight="600">Tinh nang</text>

  <!-- Months -->
  <text x="480" y="93" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">07/2026</text>
  <text x="620" y="93" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">08/2026</text>
  <text x="760" y="93" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">09/2026</text>
  <text x="900" y="93" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">10/2026</text>

  <!-- Grid lines -->
