  <rect x="60" y="465" width="160" height="44" rx="4" fill="#1e1b4b" stroke="#2d2d4a" stroke-width="1"/>
  <text x="140" y="485" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">GD 7</text>
  <text x="140" y="500" text-anchor="middle" fill="#94a3b8" font-size="10">Multi-tab Sessions</text>

  <rect x="600" y="475" width="120" height="24" rx="6" fill="#818cf8" opacity="0.85"/>
  <text x="660" y="492" text-anchor="middle" fill="#e0e7ff" font-size="11">Tab UI</text>

  <!-- GĐ 9: MCP Management -->
  <rect x="60" y="518" width="160" height="44" rx="4" fill="#1e1b4b" stroke="#2d2d4a" stroke-width="1"/>
  <text x="140" y="538" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">GD 9</text>
  <text x="140" y="553" text-anchor="middle" fill="#94a3b8" font-size="10">MCP Management</text>

  <rect x="740" y="528" width="100" height="24" rx="6" fill="#a5b4fc" opacity="0.7"/>
  <text x="790" y="545" text-anchor="middle" fill="#1e1b4b" font-size="11">Unified</text>

  <!-- GĐ 11: Image Generation -->
  <rect x="60" y="571" width="160" height="44" rx="4" fill="#1e1b4b" stroke="#2d2d4a" stroke-width="1"/>
  <text x="140" y="591" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">GD 11</text>
  <text x="140" y="606" text-anchor="middle" fill="#94a3b8" font-size="10">Image Gen</text>

  <rect x="860" y="581" width="80" height="24" rx="6" fill="#c4b5fd" opacity="0.7"/>
  <text x="900" y="598" text-anchor="middle" fill="#1e1b4b" font-size="11">DALL-E</text>

  <!-- Legend -->
  <rect x="60" y="640" width="980" height="40" rx="8" fill="#1a1a2e" stroke="#2d2d4a" stroke-width="1"/>
  <rect x="80" y="652" width="16" height="16" rx="3" fill="#059669"/><text x="102" y="664" fill="#94a3b8" font-size="10">P0 (Core, can thiet)</text>
  <rect x="280" y="652" width="16" height="16" rx="3" fill="#6366f1"/><text x="302" y="664" fill="#94a3b8" font-size="10">P1 (Nang cao)</text>
  <rect x="460" y="652" width="16" height="16" rx="3" fill="#374151"/><text x="482" y="664" fill="#94a3b8" font-size="10">P2 (Optional)</text>
  <rect x="640" y="652" width="16" height="16" rx="3" fill="#b45309"/><text x="662" y="664" fill="#94a3b8" font-size="10">Dang phat trien</text>
