  <line x1="600" y1="70" x2="600" y2="640" stroke="#2d2d4a" stroke-width="1" stroke-dasharray="4"/>
  <line x1="740" y1="70" x2="740" y2="640" stroke="#2d2d4a" stroke-width="1" stroke-dasharray="4"/>
  <line x1="880" y1="70" x2="880" y2="640" stroke="#2d2d4a" stroke-width="1" stroke-dasharray="4"/>
  <line x1="1020" y1="70" x2="1020" y2="640" stroke="#2d2d4a" stroke-width="1" stroke-dasharray="4"/>

  <!-- Section: P0 -->
  <rect x="60" y="116" width="980" height="30" rx="4" fill="#065f46"/>
  <text x="80" y="135" fill="#d1fae5" font-size="12" font-weight="700">P0 — Core</text>

  <!-- GĐ 1: File Preview -->
  <rect x="60" y="155" width="160" height="44" rx="4" fill="#1e1b4b" stroke="#2d2d4a" stroke-width="1"/>
  <text x="140" y="175" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="600">GD 1</text>
  <text x="140" y="190" text-anchor="middle" fill="#94a3b8" font-size="10">File Preview</text>

  <!-- Bar -->
  <rect x="240" y="165" width="200" height="24" rx="6" fill="#059669" opacity="0.85"/>
